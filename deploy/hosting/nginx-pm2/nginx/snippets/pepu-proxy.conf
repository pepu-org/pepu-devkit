# /etc/nginx/snippets/pepu-proxy.conf
# Common proxy settings for the two loopback upstreams (Alto 127.0.0.1:4337, policy service 127.0.0.1:8788).
#
# X-Forwarded-For is OVERWRITTEN with the TCP peer nginx saw, not appended ($proxy_add_x_forwarded_for):
# a client cannot inject a fake left-hand entry. The policy service runs with TRUST_PROXY=true and
# TRUSTED_PROXY_HOPS=1, i.e. it takes the LAST entry, which is therefore exactly the real client.
# If you ever put another proxy/CDN in front of nginx, switch to $proxy_add_x_forwarded_for AND raise
# TRUSTED_PROXY_HOPS to 2, and configure ngx_http_realip for the rate limits. Not needed for a direct A record.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The shared secret is checked here, not by the backends: never forward it.
proxy_set_header X-Pepu-Bundler-Key "";

# HTTP/1.0 to the upstream (no keepalive pool) on purpose: Node closes idle keep-alive sockets after 5 s,
# and reusing a socket Node just closed produces sporadic 502s. Loopback connects are free.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;

# Never replay a request on another attempt: a retried eth_sendUserOperation / pm_getPaymasterData
# would be processed twice. There is one upstream anyway.
proxy_next_upstream off;

# Buffer the whole request body before talking to Node (slow-loris clients never reach the backend).
proxy_request_buffering on;
