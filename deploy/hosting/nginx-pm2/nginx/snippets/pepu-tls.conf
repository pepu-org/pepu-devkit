# /etc/nginx/snippets/pepu-tls.conf
# TLS settings for the pepu sites. Certificates themselves are per site (certbot webroot, see RUNBOOK).
# Self-contained: does not depend on certbot's options-ssl-nginx.conf (only present after `certbot --nginx`).
# For HTTP/2 add `http2` to the `listen 443 ssl` line (nginx < 1.25.1) or `http2 on;` (nginx >= 1.25.1);
# JSON-RPC works fine over HTTP/1.1, so the shipped configs do not.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:pepu_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
