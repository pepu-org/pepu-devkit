# /etc/nginx/snippets/pepu-security-headers.conf
# Included in every pepu location that sets its own add_header (nginx does not inherit add_header
# into a block that defines another one). HSTS has no includeSubDomains/preload on purpose: this
# host may serve other subdomains of the same apex.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "no-store" always;
