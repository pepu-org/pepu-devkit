# /etc/nginx/sites-available/pepu-acme-bootstrap.conf
# TEMPORARY, plain-HTTP-only. Lets certbot (webroot) issue the two certificates BEFORE the real site files are
# enabled; those reference /etc/letsencrypt/live/<host>/ and `nginx -t` fails until the certificates exist.
#
# Procedure (RUNBOOK "TLS"):
#   enable this file -> nginx -t && reload -> certbot certonly --webroot ... -> DISABLE this file (the real
#   site files contain the same port-80 server blocks, and two blocks for one server_name conflict).
#
# Everything except the challenge directory answers 404, so nothing is exposed while it is enabled.

server {
    listen 80;
    server_name bundler.pepeunchained.com paymaster.pepeunchained.com;
    server_tokens off;

    access_log /var/log/nginx/pepu-acme.access.log;
    error_log  /var/log/nginx/pepu-acme.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
