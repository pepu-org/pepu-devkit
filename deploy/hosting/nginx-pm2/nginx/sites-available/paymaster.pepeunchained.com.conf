# /etc/nginx/sites-available/paymaster.pepeunchained.com.conf
# Public edge for the v1 paymaster policy service on this host. Port of the `paymaster.{$DOMAIN}` block of
# deploy/hosting/Caddyfile. Separate server blocks only: it touches no other site.
#
#   Internet --443--> nginx (TLS, per-IP rate limits, body cap, Origin allowlist, path allowlist,
#                           token-redacted JSON log) --> 127.0.0.1:8788 (policy service, pm2, ONE instance)
#
# Needs (http context, see ../conf.d/): pepu-zones.conf, pepu-origins.conf.
# Needs (snippets): pepu-security-headers.conf, pepu-tls.conf, pepu-proxy.conf.
# Certificate: /etc/letsencrypt/live/paymaster.pepeunchained.com/ (RUNBOOK section "TLS").
#
# Served paths (everything else is 404, including /admin*, /ready from outside, /metrics, //anything, /v2/*):
#   /paymaster/<token>      ERC-7677 JSON-RPC (POST + the service's own OPTIONS preflight)   zone pepu_paymaster_rpc
#   POST /sponsor           legacy REST sponsorship (Privy access token + X-Api-Key)          zone pepu_sponsor
#   GET|HEAD /health        liveness
#   GET /ready              loopback only (monitoring on this host). Never public.
#
# CORS: the policy service answers /paymaster/<token> preflights and sets the CORS headers itself, from
# PAYMASTER_RPC_ALLOWED_ORIGINS. nginx only REFUSES non-allowlisted browser origins (403) before they reach it.
#
# TOKEN HYGIENE. The app token is the last path segment. The access log redacts it (pepu_json). The nginx
# ERROR log can still print the request line for upstream failures, so this site logs errors at `crit` only:
# 502/504 are visible in the access log (status + upstream_status) instead. Do not raise it to `error`/`warn`
# without a redaction plan, and keep /var/log/nginx at 640 root:adm.

server {
    listen 80;
    # listen [::]:80;                  # uncomment only if the DNS name has an AAAA record
    server_name paymaster.pepeunchained.com;
    server_tokens off;

    access_log /var/log/nginx/pepu-paymaster.access.log pepu_json;
    error_log  /var/log/nginx/pepu-paymaster.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 308 keeps the method and body. A token sent over plain http is already exposed: fix the client URL.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;             # uncomment only if the DNS name has an AAAA record
    server_name paymaster.pepeunchained.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/paymaster.pepeunchained.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paymaster.pepeunchained.com/privkey.pem;
    include snippets/pepu-tls.conf;

    access_log /var/log/nginx/pepu-paymaster.access.log pepu_json;
    error_log  /var/log/nginx/pepu-paymaster.error.log crit;

    client_max_body_size      256k;     # the policy service caps at 256 KiB too; over this: 413
    client_body_buffer_size   256k;
    client_header_timeout     10s;
    client_body_timeout       20s;
    send_timeout              60s;
    keepalive_timeout         65s;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;
    limit_req_status          429;
    limit_req_log_level       warn;
    limit_conn_status         429;
    limit_conn_log_level      warn;
    default_type              text/plain;

    # ---- gates that apply to every request on this host ----
    if ($request_uri ~ "^//") {                       # raw request line; $uri would already have merged the slashes
        return 404 "not found\n";
    }
    if ($pepu_origin_ok = 0) {                        # browser Origin not on the allowlist (conf.d/pepu-origins.conf)
        return 403 "origin not allowed\n";
    }

    # ---- ERC-7677 paymaster JSON-RPC ----
    location ~ ^/paymaster/[^/]+$ {
        limit_req  zone=pepu_paymaster_rpc burst=20 nodelay;   # ~120/min sustained; preflights are limited too
        limit_conn pepu_conn 30;
        include snippets/pepu-security-headers.conf;
        include snippets/pepu-proxy.conf;
        proxy_read_timeout 30s;                       # pm_getPaymasterData signs locally; the DB write is the slow part
        proxy_pass http://127.0.0.1:8788;
        error_page 502 503 504 = @pepu_bad_gateway;
    }

    # ---- legacy REST sponsorship ----
    location = /sponsor {
        if ($request_method != POST) {
            return 404 "not found\n";
        }
        limit_req  zone=pepu_sponsor burst=10 nodelay;         # ~60/min sustained
        limit_conn pepu_conn 30;
        include snippets/pepu-security-headers.conf;
        include snippets/pepu-proxy.conf;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8788;
        error_page 502 503 504 = @pepu_bad_gateway;
    }

    location = /health {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 404 "not found\n";
        }
        limit_req zone=pepu_misc burst=20 nodelay;
        include snippets/pepu-security-headers.conf;
        include snippets/pepu-proxy.conf;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8788;
        error_page 502 503 504 = @pepu_bad_gateway;
    }

    # ---- /ready: DB + chain RPC + deposit as the service sees them. Reachable from THIS HOST ONLY ----
    # Everyone else gets the same 404 as any unknown path. From the VPS:
    #   curl -s --resolve paymaster.pepeunchained.com:443:127.0.0.1 https://paymaster.pepeunchained.com/ready
    # (the monitor simply uses http://127.0.0.1:8788/ready, which does not go through nginx at all).
    location = /ready {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        error_page 403 = @pepu_not_found;
        include snippets/pepu-security-headers.conf;
        include snippets/pepu-proxy.conf;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:8788;
    }

    # ---- OPTIONAL v2 (tiered sponsorship) -------------------------------------------------------
    # OFF as shipped: SPONSORSHIP_V2_ENABLED is unset, so the service does not serve /v2/* and this site answers
    # 404. If you enable v2 (see services/paymaster/policy-service/README.md), uncomment this block. It exposes
    # the public/auth/project/ERC-7677 routes with their own zone and still refuses /v2/admin/* from outside;
    # the v2 admin API stays loopback-only (operators reach it on 127.0.0.1:8788 over SSH).
    #
    #   location ^~ /v2/admin/ { return 404 "not found\n"; }
    #   location ^~ /v2/ {
    #       limit_req  zone=pepu_v2 burst=20 nodelay;
    #       limit_conn pepu_conn 30;
    #       include snippets/pepu-security-headers.conf;
    #       include snippets/pepu-proxy.conf;
    #       proxy_read_timeout 30s;
    #       proxy_pass http://127.0.0.1:8788;
    #       error_page 502 503 504 = @pepu_bad_gateway;
    #   }
    # v2 CORS is done by the service (SPONSORSHIP_API_ALLOWED_ORIGINS, PAYMASTER_RPC_ALLOWED_ORIGINS). TRUST_PROXY=true
    # with TRUSTED_PROXY_HOPS=1 (already set in ecosystem.config.cjs) is what makes its per-IP limiters see the client.

    # ---- everything else, including /admin/*, /metrics, /v2/*: not found ----
    location / {
        return 404 "not found\n";
    }

    location @pepu_not_found {
        return 404 "not found\n";
    }

    location @pepu_bad_gateway {
        default_type application/json;
        return 502 '{"jsonrpc":"2.0","id":null,"error":{"code":-32603,"message":"paymaster unavailable"}}\n';
    }
}
