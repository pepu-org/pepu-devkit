# /etc/nginx/sites-available/bundler.pepeunchained.com.conf
# Public edge for the Alto bundler (ERC-4337 JSON-RPC) on this host. Port of the `bundler.{$DOMAIN}` block of
# deploy/hosting/Caddyfile. Separate server blocks only: it touches no other site.
#
#   Internet --443--> nginx (TLS, per-IP rate limit, body cap, Origin allowlist + CORS, path allowlist,
#                           optional shared secret, redacted JSON log) --> 127.0.0.1:4337 (Alto, pm2)
#
# WHY A PROXY AT ALL. Port 4337 must NEVER be reachable directly: Alto runs with safe-mode=false (upstream 0.0.21 bug,
# see services/bundler/README.md "The safe-mode bug"), Alto's CORS flag would reflect ANY origin (so it is off in
# alto.config.prod.json and nginx owns CORS here), and Alto has no per-IP limits of its own.
#
# Needs (http context, see ../conf.d/): pepu-zones.conf, pepu-origins.conf, pepu-bundler-key.conf.
# Needs (snippets): pepu-security-headers.conf, pepu-tls.conf, pepu-proxy.conf.
# Certificate: /etc/letsencrypt/live/bundler.pepeunchained.com/ (RUNBOOK section "TLS"). Until it exists,
# `nginx -t` fails on this file: install pepu-acme-bootstrap.conf first, get the certificate, then enable this one.
#
# Served paths (everything else is 404, including /admin, /metrics, /debug*, //anything):
#   POST /  POST /rpc  POST /v<N>/rpc     JSON-RPC           (rate limited, shared secret if enabled)
#   OPTIONS on those                      CORS preflight     (answered here, never reaches Alto)
#   GET|HEAD /health                      liveness for uptime checkers (exempt from the secret)

server {
    listen 80;
    # listen [::]:80;                  # uncomment only if the DNS name has an AAAA record
    server_name bundler.pepeunchained.com;
    server_tokens off;

    access_log /var/log/nginx/pepu-bundler.access.log pepu_json;
    error_log  /var/log/nginx/pepu-bundler.error.log warn;

    # Let's Encrypt HTTP-01 (certbot --webroot -w /var/www/certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 308 keeps the method and body of a POST that was sent to http:// by mistake.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;             # uncomment only if the DNS name has an AAAA record
    server_name bundler.pepeunchained.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bundler.pepeunchained.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bundler.pepeunchained.com/privkey.pem;
    include snippets/pepu-tls.conf;

    access_log /var/log/nginx/pepu-bundler.access.log pepu_json;
    error_log  /var/log/nginx/pepu-bundler.error.log warn;

    # ---- request limits (Caddy: request_body 256KB; timeouts read_header 10s, read_body 20s, write 60s, idle 2m) ----
    client_max_body_size      256k;     # over this: 413
    client_body_buffer_size   256k;
    client_header_timeout     10s;
    client_body_timeout       20s;
    send_timeout              60s;
    keepalive_timeout         65s;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;
    limit_req_status          429;
    limit_req_log_level       warn;
    limit_conn_status         429;
    limit_conn_log_level      warn;
    default_type              text/plain;   # bodies of the short `return` answers below

    # ---- gates that apply to every request on this host ----
    # 1. Refuse request targets that start with // (protocol-relative paths; the services refuse them too).
    #    Tested on the RAW request line: $uri would already have merged the slashes.
    if ($request_uri ~ "^//") {
        return 404 "not found\n";
    }
    # 2. A browser sent an Origin that is not on the allowlist (conf.d/pepu-origins.conf). No Origin = not a browser.
    if ($pepu_origin_ok = 0) {
        return 403 "origin not allowed\n";
    }

    # ---- liveness (exempt from the shared secret; Alto's /metrics is NOT proxied) ----
    location = /health {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 404 "not found\n";
        }
        limit_req zone=pepu_misc burst=20 nodelay;
        include snippets/pepu-security-headers.conf;
        include snippets/pepu-proxy.conf;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:4337;
        error_page 502 503 504 = @pepu_bad_gateway;
    }

    # ---- JSON-RPC: Alto serves POST /, /rpc and /<version>/rpc ----
    location ~ ^/(rpc|v[0-9]+/rpc)?$ {
        # CORS preflight: answered here, before the shared-secret check (a preflight carries no custom
        # headers) and before the rate limit (it is a cheap 204 that never reaches Alto).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $pepu_cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age       600 always;
            add_header Vary                         Origin always;
            add_header Strict-Transport-Security    "max-age=31536000" always;
            add_header X-Content-Type-Options       "nosniff" always;
            return 204;
        }
        if ($request_method != POST) {
            return 404 "not found\n";
        }
        # Optional shared secret (conf.d/pepu-bundler-key.conf). Always 1 while disabled.
        if ($pepu_bundler_key_ok = 0) {
            return 401 "unauthorized\n";
        }

        limit_req  zone=pepu_bundler_rpc burst=60 nodelay;   # ~300/min sustained, 60 extra at once
        limit_conn pepu_conn 40;

        # CORS for the allowlisted browser origin (empty value = header omitted).
        add_header Access-Control-Allow-Origin $pepu_cors_origin always;
        add_header Vary Origin always;
        include snippets/pepu-security-headers.conf;

        include snippets/pepu-proxy.conf;
        proxy_hide_header Access-Control-Allow-Origin;      # nginx owns CORS; Alto's own is off, belt and braces
        # eth_sendUserOperation and eth_estimateUserOperationGas simulate against the chain RPC (and on the
        # arbitrum chain-type read L1 fees); estimates can take several seconds under load. 90 s is generous
        # without letting a stuck request hold a worker forever. Caddy used 60 s; browsers/SDK time out first.
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:4337;
        error_page 502 503 504 = @pepu_bad_gateway;
    }

    # ---- everything else, including /metrics, /admin, /debug_*, /ready, /v2: not found ----
    location / {
        return 404 "not found\n";
    }

    location @pepu_bad_gateway {
        default_type application/json;
        return 502 '{"jsonrpc":"2.0","id":null,"error":{"code":-32603,"message":"bundler unavailable"}}\n';
    }
}
