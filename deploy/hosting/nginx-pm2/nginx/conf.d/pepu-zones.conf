# /etc/nginx/conf.d/pepu-zones.conf   (http context; auto-included by the stock nginx.conf)
#
# Everything PEPU needs at http level, in one file, so the site files stay plain server blocks and
# nothing here can collide with other sites on this host: EVERY name below is prefixed `pepu_`
# (zones, log formats, map variables). No directive in this file is a global setting, and the
# rate-limit zones only act where a pepu site says `limit_req zone=pepu_...`.
#
# Before reloading nginx, check for a clash:   grep -rn "pepu_" /etc/nginx | grep -v "pepu-"
#
# Rates mirror the Caddy kit (requests per minute per client IP): bundler 300, paymaster 120,
# sponsor 60. The site files add a burst on top, because a UserOp flow fires 10-20 bundler calls
# (estimate, send, receipt polling) within a few seconds. Tune from the access logs.

# ---- per-IP rate limits (10 MB holds ~160k IPv4 states per zone) ---------------------------------
limit_req_zone $binary_remote_addr zone=pepu_bundler_rpc:10m  rate=300r/m;   # bundler JSON-RPC
limit_req_zone $binary_remote_addr zone=pepu_paymaster_rpc:10m rate=120r/m;  # /paymaster/<token> (ERC-7677)
limit_req_zone $binary_remote_addr zone=pepu_sponsor:10m      rate=60r/m;    # legacy POST /sponsor
limit_req_zone $binary_remote_addr zone=pepu_v2:10m           rate=120r/m;   # /v2/* (only if you expose it)
limit_req_zone $binary_remote_addr zone=pepu_misc:1m          rate=60r/m;    # GET /health on both hosts
limit_conn_zone $binary_remote_addr zone=pepu_conn:10m;                      # concurrent connections per IP

# ---- log redaction -------------------------------------------------------------------------------
# The paymaster app token is the last segment of the URL path (/paymaster/<token>). Never log it.
# $pepu_log_uri is $request_uri with that segment replaced; the format below uses it instead of
# $request / $request_uri. (The query string is kept: no secret travels there.)
map $request_uri $pepu_log_uri {
    ~^(?<pepu_pfx>/v2/paymaster/|/paymaster/)[^/?]+(?<pepu_rest>.*)$   "${pepu_pfx}REDACTED${pepu_rest}";
    default                                                            $request_uri;
}

# One JSON object per line (same idea as the Caddy JSON access log). No Authorization, X-Api-Key,
# X-Admin-Token, X-Pepu-Bundler-Key or Cookie header and no request body is ever logged.
log_format pepu_json escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$pepu_log_uri","proto":"$server_protocol","status":$status,"bytes":$body_bytes_sent,'
    '"req_len":$request_length,"rt":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_rt":"$upstream_response_time","origin":"$http_origin","ua":"$http_user_agent",'
    '"rid":"$request_id"}';
