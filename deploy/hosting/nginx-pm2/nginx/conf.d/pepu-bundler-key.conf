# /etc/nginx/conf.d/pepu-bundler-key.conf   (http context)
#
# OPTIONAL shared secret for the bundler. DISABLED as shipped: $pepu_bundler_key_ok is always 1.
#
# Enable it only if every caller of the bundler is a server you control (a browser bundle or the SDK's
# hosted default cannot hold a secret). Callers then send the header   X-Pepu-Bundler-Key: <secret>.
# CORS preflights and GET /health are exempt. The healthcheck monitor sends it when
# BUNDLER_SHARED_SECRET is set in /etc/pepu/monitor.env.
#
# To enable, REPLACE this file ON THE SERVER (the secret must never be committed) with:
#
#   SECRET=$(openssl rand -hex 32)
#   printf 'map $http_x_pepu_bundler_key $pepu_bundler_key_ok {\n    default 0;\n    "%s" 1;\n}\n' "$SECRET" \
#     | sudo tee /etc/nginx/conf.d/pepu-bundler-key.conf >/dev/null
#   sudo chmod 600 /etc/nginx/conf.d/pepu-bundler-key.conf     # nginx's master process reads it as root
#   sudo nginx -t && sudo systemctl reload nginx
#
# To disable again, copy this file back from the repo (deploy/hosting/nginx-pm2/nginx/conf.d/).
# The header is stripped before the request is forwarded (see snippets/pepu-proxy.conf).

map $http_x_pepu_bundler_key $pepu_bundler_key_ok {
    default 1;
}
