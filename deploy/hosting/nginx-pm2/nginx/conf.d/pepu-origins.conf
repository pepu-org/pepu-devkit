# /etc/nginx/conf.d/pepu-origins.conf   (http context)
#
# Browser Origin allowlist shared by bundler.pepeunchained.com and paymaster.pepeunchained.com.
# THIS IS THE FILE THE OWNER EDITS to decide which frontends may call the endpoints from a browser.
#
# Semantics (same as the Caddy kit):
#   - a request with NO Origin header (curl, servers, the SDK from Node, prove-session) passes
#     through; it is governed by the rate limit, the optional shared secret and the app token;
#   - a request WITH an Origin header must match one of the patterns below, otherwise nginx answers 403;
#   - Origin is not authentication: it only stops other websites' visitors from using these endpoints
#     through their browsers. Anything outside a browser can fake it.
#
# Patterns are anchored regexes (PCRE, case-sensitive) on the full Origin value: scheme://host[:port].
# Escape dots. Keep them in sync with PAYMASTER_RPC_ALLOWED_ORIGINS in /etc/pepu/policy-service.env
# (that one is an exact-match list, no regex).
#
# After editing:   sudo nginx -t && sudo systemctl reload nginx

map $http_origin $pepu_origin_ok {
    default 0;          # an Origin header that matches nothing below: refused with 403
    ""      1;          # no Origin header: not a browser

    # --- DECISION (owner): replace with the real frontend origins ---------------------------------
    ~^https://(www\.)?pepeunchained\.com$           1;
    ~^https://guide\.pepeunchained\.com$            1;
    # ~^https://app\.pepeunchained\.com$            1;
    # Local development against the hosted endpoints (remove for production):
    # ~^http://localhost:(3000|5173)$               1;
}

# The value echoed in Access-Control-Allow-Origin: the request's own Origin when it passed the
# allowlist above, otherwise empty (nginx omits a header whose value is empty).
map "$pepu_origin_ok:$http_origin" $pepu_cors_origin {
    default "";
    "~^1:(?<pepu_o>.+)$" $pepu_o;
}
