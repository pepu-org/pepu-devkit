<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>#frame{height:690px;padding:0}
.browser{position:absolute;left:48px;top:48px;width:760px;border-radius:14px;overflow:hidden;border:1px solid var(--line-strong);background:var(--surface);box-shadow:0 30px 70px -20px rgb(0 0 0/.9),0 0 60px -10px rgb(14 155 9/.4)}
.bar{height:34px;background:var(--raised);display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.bar span{margin-left:12px;flex:1;background:rgb(0 0 0/.35);border-radius:999px;padding:3px 14px;font-size:12px;color:var(--ink-muted);font-family:var(--mono)}
.browser img{display:block;width:100%}
.phone{position:absolute;right:70px;top:44px;width:230px;border-radius:34px;border:6px solid #1a2e1c;outline:1px solid var(--line-strong);overflow:hidden;box-shadow:0 30px 70px -20px rgb(0 0 0/.9),0 0 60px -10px rgb(208 255 0/.18)}
.phone img{display:block;width:100%}
.cap{position:absolute;left:48px;bottom:34px;display:flex;gap:14px;align-items:center}
.cap .pill{font-size:15px;padding:8px 20px}.cap span.m{font-size:13px;color:var(--ink-muted)}</style>
<body><div id="frame">
<div class="browser"><div class="bar"><i></i><i></i><i></i><span>roadmap-demo.pepeunchained.com</span></div><img src="../shots/demo-desktop.png"></div>
<div class="phone"><img src="../shots/demo-mobile.png"></div>
<div class="cap"><span class="pill l">Try the live demo</span><span class="m">roadmap-demo.pepeunchained.com · the sponsored-session-app template</span></div>
</div>
